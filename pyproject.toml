[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsechange3d"
version = "0.1.0"
description = "SparseChange3D implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.2", "scipy>=1.11", "matplotlib>=3.7", "Pillow>=10", "trimesh>=4"]

[project.scripts]
sparsechange3d = "sparsechange3d.cli:main"

[tool.setuptools.packages.find]
include = ["sparsechange3d*"]
